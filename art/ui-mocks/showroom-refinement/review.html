<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#101014" />
    <title>Review the showroom refinement</title>
    <style>
      @font-face {
        font-family: Geist;
        src: url('/fonts/geist.woff2');
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      html {
        color-scheme: dark;
      }
      body {
        margin: 0;
        color: #e8e8e6;
        background: #101014;
        font:
          14px/1.5 Geist,
          sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px 32px;
        padding: 16px 24px;
        border-bottom: 1px solid #45454f;
      }
      header strong {
        font-size: 16px;
        font-weight: 500;
      }
      p {
        margin: 4px 0 0;
        color: #aaaab3;
      }
      nav,
      .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button,
      a {
        font: inherit;
        color: inherit;
      }
      button {
        border: 1px solid #45454f;
        border-radius: 8px;
        min-height: 44px;
        padding: 8px 14px;
        background: transparent;
        cursor: pointer;
      }
      button:hover {
        border-color: #aaaab3;
      }
      button[aria-pressed='true'] {
        background: #e8e8e6;
        color: #101014;
        border-color: #e8e8e6;
      }
      :focus-visible {
        outline: 2px solid #e8e8e6;
        outline-offset: 3px;
      }
      .review-nav {
        padding: 12px 24px;
        display: flex;
        flex-wrap: wrap;
        gap: 16px 32px;
        justify-content: space-between;
        border-bottom: 1px solid #45454f;
      }
      .review-nav nav {
        align-items: center;
      }
      .review-nav a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding-inline: 4px;
        text-underline-offset: 5px;
      }
      main {
        height: calc(100dvh - 179px);
        min-height: 600px;
        padding: 20px;
        overflow: auto;
      }
      iframe {
        display: block;
        margin: 0 auto;
        width: 100%;
        height: 100%;
        min-height: 560px;
        border: 1px solid #45454f;
        border-radius: 12px;
        background: #101014;
      }
      iframe[data-phone] {
        width: 390px;
        height: 844px;
      }
      @media (max-width: 600px) {
        header,
        .review-nav {
          padding-inline: 16px;
        }
        main {
          padding: 12px 0;
        }
        iframe,
        iframe[data-phone] {
          width: 100%;
          border: 0;
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <strong>Showroom refinement</strong>
        <p>Same garage. A more considered presentation of the work.</p>
      </div>
      <div class="choices" role="group" aria-label="Compare designs">
        <button type="button" data-version="current" aria-pressed="false">Current site</button>
        <button type="button" data-version="proposal" aria-pressed="true">Proposed polish</button>
      </div>
    </header>
    <div class="review-nav">
      <nav aria-label="Review sections">
        <a href="#sec-intro" data-section="sec-intro">Showroom</a>
        <a href="#sec-experience" data-section="sec-experience">Experience</a>
        <a href="#sec-work" data-section="sec-work">Projects</a>
        <a href="#sec-about" data-section="sec-about">About</a>
        <a href="#sec-contact" data-section="sec-contact">Contact</a>
        <a href="./PLAN.md" target="_blank" rel="noopener">Design plan</a>
      </nav>
      <div class="choices" role="group" aria-label="Preview size">
        <button type="button" data-size="desktop" aria-pressed="true">Desktop</button>
        <button type="button" data-size="phone" aria-pressed="false">Phone · 390px</button>
      </div>
    </div>
    <main><iframe title="Interactive portfolio mock" src="./index.html"></iframe></main>
    <script>
      const frame = document.querySelector('iframe');
      let section = 'sec-intro';
      let version = 'proposal';
      document.querySelectorAll('[data-version]').forEach((button) =>
        button.addEventListener('click', () => {
          version = button.dataset.version;
          document
            .querySelectorAll('[data-version]')
            .forEach((peer) => peer.setAttribute('aria-pressed', String(peer === button)));
          frame.src = (version === 'proposal' ? './index.html' : '/') + '#' + section;
        }),
      );
      document.querySelectorAll('[data-size]').forEach((button) =>
        button.addEventListener('click', () => {
          frame.toggleAttribute('data-phone', button.dataset.size === 'phone');
          document
            .querySelectorAll('[data-size]')
            .forEach((peer) => peer.setAttribute('aria-pressed', String(peer === button)));
        }),
      );
      document.querySelectorAll('[data-section]').forEach((link) =>
        link.addEventListener('click', (event) => {
          event.preventDefault();
          section = link.dataset.section;
          frame.contentDocument
            ?.getElementById(section)
            ?.scrollIntoView({ block: 'start', behavior: 'instant' });
        }),
      );
    </script>
  </body>
</html>
