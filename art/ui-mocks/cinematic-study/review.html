<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Cinematic showroom — Desktop and mobile mock</title>
    <style>
      @font-face {
        font-family: Geist;
        src: url('/fonts/geist.woff2');
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #242429;
        color: #ececea;
        font:
          13px/1.4 Geist,
          sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 28px;
        align-items: center;
        padding: 14px 20px;
        background: #101014;
        border-bottom: 1px solid #ffffff20;
      }
      header strong {
        font-size: 16px;
        font-weight: 500;
      }
      header p {
        color: #aaaab3;
        margin: 3px 0 0;
      }
      nav {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      button,
      a {
        font: inherit;
        color: inherit;
      }
      button {
        min-height: 44px;
        border: 1px solid #ffffff30;
        background: none;
        border-radius: 8px;
        padding: 8px 12px;
        cursor: pointer;
      }
      [data-orbit] {
        border-color: #ececea;
      }
      .orbit-status {
        color: #bdbdc8;
      }
      button:hover {
        background: #292930;
      }
      button[aria-pressed='true'] {
        background: #ececea;
        color: #101014;
        border-color: #ececea;
      }
      a {
        padding: 8px;
        text-underline-offset: 4px;
      }
      main {
        padding: 16px;
        overflow: auto;
      }
      iframe {
        display: block;
        width: 100%;
        height: 900px;
        margin: auto;
        border: 0;
        background: #101014;
      }
      iframe[data-phone] {
        width: 390px;
        max-width: 100%;
        height: 844px;
      }
      :focus-visible {
        outline: 2px solid #ececea;
        outline-offset: 3px;
      }
      @media (max-width: 767px) {
        header {
          padding: 12px;
        }
        main {
          padding: 12px 0;
        }
        iframe {
          height: 844px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <strong>Opening car orbit</strong>
        <p>On desktop, the car passes in front of the name during the sweep.</p>
      </div>
      <nav aria-label="Preview size">
        <button data-size="desktop" aria-pressed="true">Desktop</button
        ><button data-size="phone" aria-pressed="false">Mobile</button>
      </nav>
      <button type="button" data-orbit>Replay opening orbit</button>
      <nav aria-label="Review moments">
        <button data-play>Replay first scroll</button><button data-moment="hero">Opening</button
        ><button data-moment="handoff">Handoff</button><button data-moment="globe">Globe</button
        ><button data-moment="iodine">Iodine</button>
      </nav>
      <span class="orbit-status" role="status"></span>
      <a href="./" target="_blank" rel="noopener">Open full preview</a>
    </header>
    <main><iframe title="Cinematic portfolio mock" src="./index.html"></iframe></main>
    <script>
      const frame = document.querySelector('iframe');
      const status = document.querySelector('.orbit-status');
      const messages = {
        waiting: 'Waiting for the car to load.',
        playing: 'Drag or scroll to interrupt.',
        settled: 'Opening orbit finished.',
        interrupted: 'Opening orbit stopped.',
        reduced: 'Reduced motion: settled view.',
      };
      window.addEventListener('message', (event) => {
        if (event.source !== frame.contentWindow || event.origin !== location.origin) return;
        const phase = event.data?.openingOrbit;
        if (Object.hasOwn(messages, phase)) status.textContent = messages[phase];
      });
      document.querySelector('[data-orbit]').addEventListener('click', () => {
        frame.contentWindow.postMessage({ replayOpeningOrbit: true }, location.origin);
      });
      document
        .querySelectorAll('[data-moment]')
        .forEach((b) =>
          b.addEventListener('click', () =>
            frame.contentWindow.postMessage({ cinemaMoment: b.dataset.moment }, location.origin),
          ),
        );
      document
        .querySelector('[data-play]')
        .addEventListener('click', () =>
          frame.contentWindow.postMessage({ cinemaPlay: true }, location.origin),
        );
      function selectSize(size) {
        frame.toggleAttribute('data-phone', size === 'phone');
        document
          .querySelectorAll('[data-size]')
          .forEach((p) => p.setAttribute('aria-pressed', String(p.dataset.size === size)));
      }
      const initialSize = new URLSearchParams(location.search).get('size');
      selectSize(
        initialSize === 'phone' || (!initialSize && innerWidth < 768) ? 'phone' : 'desktop',
      );
      document.querySelectorAll('[data-size]').forEach((b) =>
        b.addEventListener('click', () => {
          selectSize(b.dataset.size);
          const url = new URL(location.href);
          url.searchParams.set('size', b.dataset.size);
          history.replaceState(null, '', url);
        }),
      );
    </script>
  </body>
</html>
