name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Types, lint, formatting, the size ceilings, the comment rules, the test floor, then the
      # build. The same command locally, so CI is never the first place a check runs.
      - run: npm run verify
