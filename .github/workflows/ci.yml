name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]
    runs-on: ubuntu-24.04
    container:
      # Keep the browser image aligned with @playwright/test in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Dependency audit, types, lint, formatting, repository checks, tests, then the
      # build. The same command locally, so CI is never the first place a check runs.
      - run: npm run verify
        env:
          PORTFOLIO_CI_PICOMATCH_EXCEPTION: '1'
      - run: npm run test:browser -- --project "${{ matrix.project }}" --reporter=list
        env:
          PORTFOLIO_BUILD_READY: '1'

  check:
    runs-on: ubuntu-24.04
    needs: browser
    if: always()
    steps:
      - run: test "$BROWSER_RESULT" = success
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
